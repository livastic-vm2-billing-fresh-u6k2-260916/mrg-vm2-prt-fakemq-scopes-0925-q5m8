name: VM2 PRT Scope Server
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  scope-report-ready:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@v5

      - name: Detect Mergify refs
        id: refs
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes-git-refs

      - name: Compute trusted scope from fetched objects
        id: scope
        shell: bash
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          echo "BASE=$BASE"
          echo "HEAD=$HEAD"
          git fetch --no-tags origin "$BASE" "$HEAD"
          if git diff --name-only "$BASE...$HEAD" | grep -q '^protected/'; then
            echo "scopes=protected" >> "$GITHUB_OUTPUT"
            echo "VM2_SCOPE_RESULT=protected"
          else
            echo "scopes=safe" >> "$GITHUB_OUTPUT"
            echo "VM2_SCOPE_RESULT=safe"
          fi

      - name: Deterministically delay safe revision upload
        if: steps.scope.outputs.scopes == 'safe'
        shell: bash
        run: |
          echo "VM2_DELAY_SAFE_REVISION=180"
          sleep 180

      - name: Upload scope using official default pinned CLI
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes-upload
          scopes: ${{ steps.scope.outputs.scopes }}
          token: ${{ secrets.MERGIFY_TOKEN }}

      - name: Current-head gate keeps revision A unmergeable
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD"
          if git cat-file -e "$HEAD:protected/critical.txt" 2>/dev/null; then
            echo "VM2_CURRENT_HEAD_GATE=protected"
            exit 0
          fi
          echo "VM2_CURRENT_HEAD_GATE=safe"
          exit 1
