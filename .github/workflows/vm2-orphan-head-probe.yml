name: VM2 orphaned-head scope endpoint probe
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to probe
        required: true
      pr:
        description: PR number for logging only
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe commit-scoped Mergify endpoint
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          TARGET_SHA: ${{ inputs.sha }}
          PR_NUMBER: ${{ inputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"scopes":["vm2-orphan-head-probe"],"all_scopes":false}'
          status=$(curl -sS -o /tmp/mergify-body -w '%{http_code}' -X PUT             -H 'Content-Type: application/json'             -H "Authorization: Bearer ${MERGIFY_TOKEN}"             --data "$body"             "https://api.mergify.com/v1/repos/livastic-vm2-billing-fresh-u6k2-260916/mrg-vm2-prt-fakemq-scopes-0925-q5m8/commits/${TARGET_SHA}/scopes")
          echo "PR_NUMBER=${PR_NUMBER}"
          echo "COMMIT_SCOPE_STATUS=${status}"
